name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Backend Docker Image
      run: docker build ./backend --file backend/Dockerfile --tag portfolio-backend:test
    
    - name: Verify Backend Build Artifacts
      run: |
        echo "Checking if dist directory exists..."
        docker run --rm portfolio-backend:test ls -la /app/dist
        echo "Checking if server.js was compiled..."
        docker run --rm portfolio-backend:test test -f /app/dist/server.js && echo "✅ server.js found" || exit 1

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Frontend Docker Image
      run: docker build ./frontend --file frontend/Dockerfile --tag portfolio-frontend:test
    
    - name: Verify Frontend Build Artifacts
      run: |
        echo "Checking if Next.js standalone was built..."
        docker run --rm portfolio-frontend:test ls -la /app
        echo "Checking if server.js exists..."
        docker run --rm portfolio-frontend:test test -f /app/server.js && echo "✅ server.js found" || exit 1

  integration-test:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start MongoDB
      run: |
        docker run -d --name mongodb \
          -p 27017:27017 \
          mongo:7.0
        sleep 5
    
    - name: Build Backend
      run: docker build ./backend --file backend/Dockerfile --tag portfolio-backend:test
    
    - name: Build Frontend
      run: docker build ./frontend --file frontend/Dockerfile --tag portfolio-frontend:test
    
    - name: Run Backend
      run: |
        docker run -d --name backend \
          --network host \
          -e MONGO_URI=mongodb://localhost:27017/portfolio \
          -e NODE_ENV=production \
          -e PORT=5000 \
          -e CORS_ORIGIN=http://localhost:3000 \
          portfolio-backend:test
        sleep 15
    
    - name: Check Backend Health
      run: |
        curl -f http://localhost:5000/health || exit 1
    
    - name: Seed Database
      run: |
        docker exec backend node dist/scripts/seed.js
    
    - name: Test Backend API Endpoints
      run: |
        curl -f http://localhost:5000/api/profile || exit 1
        curl -f http://localhost:5000/api/experience || exit 1
        curl -f http://localhost:5000/api/projects || exit 1
        curl -f http://localhost:5000/api/skills || exit 1
    
    - name: Show Logs on Failure
      if: failure()
      run: |
        docker logs backend || true
        docker logs mongodb || true
